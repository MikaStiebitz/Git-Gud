<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241a3a"/>
      <stop offset="55%" stop-color="#171126"/>
      <stop offset="100%" stop-color="#120d1e"/>
    </linearGradient>
    <linearGradient id="glyph" gradientUnits="userSpaceOnUse" x1="120" y1="110" x2="392" y2="420">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- full-bleed rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- subtle inner rim light -->
  <rect x="6" y="6" width="500" height="500" rx="98" fill="none" stroke="#a855f7" stroke-opacity="0.28" stroke-width="4"/>

  <!-- git branch glyph, bold and centered -->
  <g filter="url(#glow)" stroke="url(#glyph)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="176" y1="118" x2="176" y2="304"/>
    <circle cx="336" cy="150" r="46" fill="#171126"/>
    <circle cx="176" cy="368" r="46" fill="#171126"/>
    <path d="M336 196 c0 84 -66 118 -114 122"/>
  </g>
</svg>
